
# COMMON CONFIGURATIONS
author: "Javier Paris"
logo: ../../templates/images/cunef.png
footer: "Aprendizaje Automático"
# placeholder: "../../templates/images/placeholder.png"

# Para poder aumentar los plots de python
engine: knitr

# RENDER CONFIGURATIONS
format:

################################################################################
  # REVEAL.JS CONFIGURATION
  revealjs:

    # Code configuration
    execute:
      echo: true
      eval: true
      output: true
    jupyter: python3

    # Table of contents configuration
    toc: false
    toc-depth: 1
    menu: true

    # Slide configuration
    progress: true
    slide-number: c/t
    transition: slide
    scrollable: false
    height: 900
    width: 1600
    slide-level: 2
    from: markdown+emoji
    center-title-slide: true
    number-sections: true
    overflow: true
    autoSlideResize: true
    auto-stretch: false

    # Navigation
    # horizontal to make it linear
    navigation-mode: vertical
    controls: true
    controls-layout: bottom-right
    # controls-tutorial: true
    touch: true

    # Style configuration
    # The footer will be automatically changed
    css: ../../templates/style/style.css
    incremental: false
    theme: ../../templates/style/custom_theme.scss
    include-after-body: ../../templates/code/code.html

    # TODO: Add fig-align center by default
    # fig-align: center

    # Main slide configuration
    title-slide-attributes:
      data-background-image: ../../templates/images/cunef.png
      data-background-size: 80%
      data-background-position: center
      data-background-opacity: 20%

    output-ext: "_revealjs.html"

################################################################################
  # PDF CONFIGURATION
  pdf:

    # Table of contents configuration
    toc: true
    toc-depth: 2
    number-sections: true


################################################################################
  # HTML CONFIGURATION
  html:

    # Table of contents configuration
    toc: true
    number-sections: true


format-links: [revealjs, pdf]
pdf: "[PDF](a.pdf)"
